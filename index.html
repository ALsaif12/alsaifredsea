// Parse a 'YYYY-MM-DD' string as LOCAL midnight (not UTC) — avoids the
// timezone shift that pushes bookings onto the wrong calendar day in UTC+ zones.
const parseLocal = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d) }
// Normalize any input to a Date: date-only strings → local midnight; everything else (timestamps, Date objs) → as-is.
const toDate = d => (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) ? parseLocal(d) : new Date(d)

const fmt = {
  sar:   n => new Intl.NumberFormat('en-US',{style:'currency',currency:'SAR',maximumFractionDigits:0}).format(n||0),
  date:  d => toDate(d).toLocaleDateString('en-GB',{weekday:'short', day:'2-digit', month:'short'}),
  long:  d => toDate(d).toLocaleDateString('en-GB',{weekday:'long', day:'2-digit', month:'long', year:'numeric'}),
  month: d => toDate(d).toLocaleDateString('en-GB',{month:'long', year:'numeric'}),
  short: d => toDate(d).toLocaleDateString('en-GB',{day:'2-digit', month:'short'}),
  iso:   d => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10) },
  rel:   d => {
    const diff = (toDate(d) - new Date()) / 86400000
    const r = Math.round(diff)
    if (r === 0) return 'today'
    if (r === 1) return 'tomorrow'
    if (r === -1) return 'yesterday'
    if (r > 0) return `in ${r} days`
    return `${Math.abs(r)} days ago`
  }
}

const nights = (s,e) => Math.max(1, Math.round((parseLocal(e)-parseLocal(s))/86400000))

const addDays = (iso, n) => { const d = parseLocal(iso); d.setDate(d.getDate()+n); return fmt.iso(d) }

/* ─────────────────────────────  data hooks  ───────────────────────────── */

function useTable(table, opts={}) {
  const [rows, setRows] = useState(null)
  const [err, setErr]   = useState(null)
  const reload = useCallback(async () => {
    setErr(null)
    let q = sb.from(table).select('*')
    if (opts.order) q = q.order(opts.order, { ascending: opts.ascending !== false })
    const { data, error } = await q
    if (error) { console.error(`[al-saif] ${table} error:`, error); setErr(error); setRows([]) }
    else setRows(data || [])
  }, [table, opts.order, opts.ascending])
  useEffect(() => { reload() }, [reload])
  useEffect(() => {
    const ch = sb.channel(`rt-${table}`).on('postgres_changes', { event:'*', schema:'public', table }, reload).subscribe()
    return () => sb.removeChannel(ch)
  }, [table, reload])
  return { rows, err, reload }
}

/* ─────────────────────────────  Calendar view  ───────────────────────────── */

function CalendarView({ properties, users, bookings, openBookFor, openEdit, onChanged }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); d.setDate(1); return d })
  const [selDate, setSelDate] = useState(null)
  const [filterProp, setFilterProp] = useState('all')
  const [deleting, setDeleting] = useState(null)
  const [confirmDel, setConfirmDel] = useState(null)

  const del = async (b) => {
    setDeleting(b.id)
    await sb.from('bookings').delete().eq('id', b.id)
    if (onChanged) { try { await onChanged() } catch(e){ console.error(e) } }
    setDeleting(null); setConfirmDel(null)
  }

  const visible = useMemo(() => filterProp==='all' ? bookings : bookings.filter(b => b.property_id===filterProp), [bookings, filterProp])

  const grid = useMemo(() => {
    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1)
    const startWeekday = first.getDay()
    const days = []
    for (let i = 0; i < startWeekday; i++) days.push(null)
    const last = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate()
    for (let d = 1; d <= last; d++) days.push(new Date(cursor.getFullYear(), cursor.getMonth(), d))
    while (days.length % 7) days.push(null)
    return days
  }, [cursor])

  const bookingsOn = d => { const iso = fmt.iso(d); return visible.filter(b => iso >= b.start_date && iso <= b.end_date) }
  const propOf = id => properties.find(p=>p.id===id)
  const userOf = id => users.find(u=>u.id===id)
  const today = fmt.iso(new Date())

  // every booking that touches the month on screen — listed below the grid
  const monthBookings = useMemo(() => {
    const mStart = fmt.iso(new Date(cursor.getFullYear(), cursor.getMonth(), 1))
    const mEnd   = fmt.iso(new Date(cursor.getFullYear(), cursor.getMonth()+1, 0))
    return visible.filter(b => b.start_date <= mEnd && b.end_date >= mStart)
      .sort((a,b)=>a.start_date.localeCompare(b.start_date))
  }, [visible, cursor])

  // one booking row — shared by the month list and the day detail
  const BookingRow = ({ b }) => {
    const p = propOf(b.property_id), w = userOf(b.booked_by)
    const nn = nights(b.start_date, b.end_date)
    return (
      <div className="flex items-center gap-3 p-3 rounded-xl bg-sand-50/60">
        <span className="w-1.5 h-10 rounded-full flex-shrink-0" style={{background:p?.color}}/>
        <div className="flex-1 min-w-0">
          <div className="font-medium text-sm truncate">{p?.name}</div>
          <div className="text-xs text-ink-mute truncate">{w?.emoji} {w?.name} · {b.guest_count} guest{b.guest_count>1?'s':''}{b.guest_names ? ` · ${b.guest_names}` : ''}</div>
        </div>
        <div className="text-xs text-ink-mute text-right flex-shrink-0">
          <div>{fmt.short(b.start_date)} → {fmt.short(b.end_date)}</div>
          <div>{nn} night{nn>1?'s':''}</div>
        </div>
        <button onClick={()=>openEdit(b)} title="Edit booking"
          className="btn w-7 h-7 rounded-full text-ink-mute hover:bg-sea-50 hover:text-sea-600 flex items-center justify-center flex-shrink-0">✎</button>
        {confirmDel === b.id ? (
          <div className="flex items-center gap-1 flex-shrink-0">
            <button onClick={()=>del(b)} disabled={deleting===b.id}
              className="btn text-xs px-2 py-1 rounded-full bg-rose-600 text-white">{deleting===b.id?'…':'Cancel it'}</button>
            <button onClick={()=>setConfirmDel(null)} className="btn text-xs px-2 py-1 rounded-full bg-sand-200 text-ink-soft">Keep</button>
          </div>
        ) : (
          <button onClick={()=>setConfirmDel(b.id)} title="Cancel booking"
            className="btn w-7 h-7 rounded-full text-ink-mute hover:bg-rose-50 hover:text-rose-600 flex items-center justify-center flex-shrink-0">✕</button>
        )}
      </div>
    )
  }

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-8 py-8 fade-in">
      <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <button onClick={()=>setCursor(new Date(cursor.getFullYear(), cursor.getMonth()-1, 1))} className="btn w-9 h-9 rounded-full bg-white shadow-soft">←</button>
          <h2 className="font-display text-3xl text-ink min-w-[14ch] text-center">{fmt.month(cursor)}</h2>
          <button onClick={()=>setCursor(new Date(cursor.getFullYear(), cursor.getMonth()+1, 1))} className="btn w-9 h-9 rounded-full bg-white shadow-soft">→</button>
          <button onClick={()=>{ const d=new Date(); d.setDate(1); setCursor(d) }} className="btn ml-2 px-3 py-1.5 rounded-full text-xs bg-sand-200/70 text-ink-soft">Today</button>
        </div>
        <select value={filterProp} onChange={e=>setFilterProp(e.target.value)}
          className="rounded-full bg-white shadow-soft px-4 py-2 text-sm border-0 focus:ring-2 focus:ring-sea-500/30">
          <option value="all">All properties</option>
          {properties.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>

      <Card className="overflow-hidden">
        <div className="grid grid-cols-7 text-center text-xs text-ink-mute py-2 border-b border-sand-100 bg-sand-50/60">
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => <div key={d} className="tracking-widest">{d.toUpperCase()}</div>)}
        </div>
        <div className="grid grid-cols-7">
          {grid.map((d,i) => {
            if (!d) return <div key={i} className="aspect-square border-r border-b border-sand-100 bg-sand-50/30"/>
            const bs = bookingsOn(d)
            const iso = fmt.iso(d)
            const isToday = iso === today
            const isSel = selDate && sameDay(selDate, d)
            return (
              <button key={i} onClick={()=>setSelDate(prev => prev && sameDay(prev, d) ? null : d)}
                className={`aspect-square border-r border-b border-sand-100 p-1.5 sm:p-2 text-left flex flex-col gap-1 hover:bg-sand-50 ${isSel?'bg-sea-50/60':''}`}>
                <div className="flex items-center justify-between">
                  <span className={`text-xs sm:text-sm ${isToday?'w-6 h-6 rounded-full bg-ink text-sand-50 flex items-center justify-center font-medium':''}`}>{d.getDate()}</span>
                </div>
                <div className="flex flex-wrap gap-0.5 mt-auto">
                  {bs.slice(0,4).map(b => {
                    const p = propOf(b.property_id)
                    return <span key={b.id} className="w-1.5 h-1.5 rounded-full" style={{background:p?.color||'#999'}}/>
                  })}
                  {bs.length > 4 && <span className="text-[9px] text-ink-mute">+{bs.length-4}</span>}
                </div>
              </button>
            )
          })}
        </div>
      </Card>

      {/* Legend */}
      <div className="mt-4 flex flex-wrap gap-3">
        {properties.map(p => (
          <div key={p.id} className="flex items-center gap-1.5 text-xs text-ink-soft">
            <span className="w-2.5 h-2.5 rounded-full" style={{background:p.color}}/>{p.name}
          </div>
        ))}
      </div>

      {/* Day detail (when a day is tapped) or the whole month's bookings */}
      {selDate ? (
        <Card className="mt-6 p-5 fade-in">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <div>
              <div className="font-display text-2xl">{fmt.long(selDate)}</div>
              <div className="text-ink-mute text-sm">
                {fmt.rel(selDate)} · <button onClick={()=>setSelDate(null)} className="text-sea-500 hover:underline">show whole month</button>
              </div>
            </div>
            <Btn kind="gold" onClick={()=>openBookFor(fmt.iso(selDate))}>Book this day</Btn>
          </div>
          {(() => {
            const items = bookingsOn(selDate)
            if (items.length === 0) return <div className="text-ink-mute text-sm p-4 text-center">Nothing scheduled — all properties available.</div>
            return <div className="space-y-2">{items.map(b => <BookingRow key={b.id} b={b} />)}</div>
          })()}
        </Card>
      ) : (
        <Card className="mt-6 p-5 fade-in">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <div>
              <div className="font-display text-2xl">Bookings in {fmt.month(cursor)}</div>
              <div className="text-ink-mute text-sm">{monthBookings.length === 0 ? 'Nothing booked this month.' : `${monthBookings.length} stay${monthBookings.length>1?'s':''} — tap ✎ to edit, or a day above for details.`}</div>
            </div>
            <Btn kind="gold" onClick={()=>openBookFor()}>✦ Book a stay</Btn>
          </div>
          {monthBookings.length > 0 && (
            <div className="space-y-2">{monthBookings.map(b => <BookingRow key={b.id} b={b} />)}</div>
          )}
        </Card>
      )}
    </div>
  )
}

// Creates a booking, or — when `editing` is a booking row — updates it in place.
// Anyone in the family can edit anyone's stay; the stay stays attributed to
// whoever originally booked it.
function BookForm({ user, users, properties, bookings, onClose, onSaved, prefill, editing }) {
  const [step, setStep] = useState(1)
  const [propertyId, setPropertyId] = useState(editing?.property_id || prefill?.propertyId || '')
  const [start, setStart] = useState(editing?.start_date || prefill?.date || fmt.iso(new Date()))
  const [end, setEnd] = useState(() => {
    if (editing) return editing.end_date > editing.start_date ? editing.end_date : addDays(editing.start_date, 1)
    return prefill?.date ? addDays(prefill.date, 1) : fmt.iso(new Date(Date.now()+86400000))
  })
  const [purpose, setPurpose] = useState(audienceOf(editing?.purpose)?.id || 'family')
  const [guestCount, setGuestCount] = useState(editing?.guest_count || 2)
  const [names, setNames] = useState(() => {     // one box per guest
    const base = (editing?.guest_names || '').split(',').map(s=>s.trim()).filter(Boolean)
    while (base.length < (editing?.guest_count || 2)) base.push('')
    return base
  })
  const [notes, setNotes] = useState(editing?.notes || '')
  const [saving, setSaving] = useState(false)
  const [error, setError] = useState(null)

  const prop = properties.find(p=>p.id===propertyId)
  const n = nights(start, end)
  const value = shadowValue(prop?.nightly_rate_sar, n)

  // changing the guest count resizes the per-guest name boxes (keeping what's typed)
  const changeCount = c => {
    c = Math.max(1, Math.min(40, c || 1))
    setGuestCount(c)
    setNames(prev => { const next = prev.slice(0, c); while (next.length < c) next.push(''); return next })
  }
  const setName = (i, v) => setNames(prev => prev.map((x,idx)=> idx===i ? v : x))

  const conflicts = useMemo(() => {
    if (!propertyId) return []
    return bookings.filter(b => b.id !== editing?.id && b.property_id === propertyId && rangeOverlaps(b.start_date, b.end_date, start, end))
  }, [bookings, propertyId, start, end, editing])
  const blocked = conflicts.length > 0

  const save = async () => {
    if (blocked) return
    setSaving(true); setError(null)
    const guest_names = names.map(s=>s.trim()).filter(Boolean).join(', ')
    const row = {
      property_id: propertyId,
      start_date: start,
      end_date: end,
      purpose, guest_count: guestCount,
      guest_names: guest_names || null,
      notes: notes || null,
    }
    const res = editing
      ? await sb.from('bookings').update(row).eq('id', editing.id)
      : await sb.from('bookings').insert({ ...row, booked_by: user.id })
    if (res.error) { setSaving(false); setError(friendlyBookingError(res.error)); return }
    if (onSaved) { try { await onSaved() } catch (e) { console.error(e) } }
    setSaving(false)
    if (!editing) celebrate()
    onClose(true)
  }

  return (
    <div className="space-y-5">
      {/* Step indicator */}
      <div className="flex items-center gap-2">
        {[1,2,3].map(i => (
          <div key={i} className={`flex-1 h-1 rounded-full ${i<=step?'bg-gold-500':'bg-sand-200'}`}/>
        ))}
      </div>

      {step === 1 && (
        <div className="space-y-3">
          <div className="text-sm font-medium text-ink-soft">Choose a property</div>
          <div className="grid gap-2">
            {properties.map(p => (
              <button key={p.id} onClick={()=>setPropertyId(p.id)}
                className={`text-left p-4 rounded-2xl border bg-white transition ${propertyId===p.id?'border-sea-500 ring-2 ring-sea-500/20':'border-sand-200 hover:border-ink-soft/30'}`}>
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-display text-lg" style={{background:p.color}}>{p.bedrooms}BR</div>
                  <div className="flex-1">
                    <div className="font-medium text-ink">{p.name}</div>
                    <div className="text-xs text-ink-mute">{p.location} · {fmt.sar(p.nightly_rate_sar)} / night</div>
                  </div>
                  {p.is_owned && <Chip tone="gold">Owned</Chip>}
                </div>
              </button>
            ))}
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="space-y-5">
          <div className="grid grid-cols-2 gap-3">
            <Field label="Check-in"><input type="date" value={start} onChange={e=>{ setStart(e.target.value); if (e.target.value >= end) setEnd(addDays(e.target.value, 1)) }} className={IPT}/></Field>
            <Field label="Check-out"><input type="date" value={end} min={addDays(start,1)} onChange={e=>{ if (e.target.value > start) setEnd(e.target.value) }} className={IPT}/></Field>
          </div>
          <div className="bg-gradient-to-br from-sand-100 to-sand-200/60 rounded-2xl p-5 flex items-center justify-between">
            <div>
              <div className="text-[12px] text-ink-mute uppercase tracking-wider">Duration</div>
              <div className="font-display text-2xl">{n} night{n>1?'s':''}</div>
            </div>
            <div className="text-right">
              <div className="text-[12px] text-ink-mute uppercase tracking-wider">Shadow value · our 40%</div>
              <div className="font-display text-2xl text-gold-600">{fmt.sar(value)}</div>
            </div>
          </div>
          {blocked && (
            <div className="bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-3 text-sm">
              <div className="font-medium mb-1">⚠ Already booked — pick different dates</div>
              <div className="text-xs space-y-0.5">
                {conflicts.map(c => {
                  const w = (users||[]).find(u=>u.id===c.booked_by)
                  return <div key={c.id}>{w ? `${w.emoji} ${w.name}` : 'Someone'} has it {fmt.short(c.start_date)} → {fmt.short(c.end_date)}</div>
                })}
              </div>
              <div className="text-[11px] mt-1.5 opacity-80">Checkout day is fine — a villa freed in the morning can be booked from that same day.</div>
            </div>
          )}
        </div>
      )}

      {step === 3 && (
        <div className="space-y-5">
          <Field label="Who's going?">
            <OptionGroup options={AUDIENCES} value={purpose} onChange={setPurpose} cols={3} />
            <div className="text-[12px] text-ink-mute mt-1.5">{audienceOf(purpose)?.hint}</div>
          </Field>

          <Field label="How many guests?">
            <div className="w-40"><Stepper value={guestCount} set={changeCount} max={40} /></div>
          </Field>

          <Field label="Guest names" hint="optional — one per guest">
            <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
              {names.map((nm, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-7 h-7 rounded-full bg-sand-100 text-ink-mute text-xs flex items-center justify-center flex-shrink-0 font-medium">{i+1}</span>
                  <input className={IPT} placeholder={`Guest ${i+1}`} value={nm} onChange={e=>setName(i, e.target.value)} />
                </div>
              ))}
            </div>
          </Field>

          <Field label="Notes" hint="optional">
            <textarea rows="2" placeholder="Arrival time, chef requests, occasion…" value={notes} onChange={e=>setNotes(e.target.value)} className={IPT}/>
          </Field>

          <Card className="p-4 bg-sand-50/80">
            <div className="text-[12px] text-ink-mute uppercase tracking-wider mb-1">Summary</div>
            <div className="font-display text-xl">{prop?.name}</div>
            <div className="text-sm text-ink-soft">{fmt.date(start)} → {fmt.date(end)} · {n} night{n>1?'s':''}</div>
            <div className="text-sm text-ink-soft">{guestCount} guest{guestCount>1?'s':''} · {audienceOf(purpose)?.icon} {audienceOf(purpose)?.label}</div>
            <div className="text-sm text-gold-600 mt-2">Shadow value (our 40%) · {fmt.sar(value)}</div>
          </Card>
          {error && <div className="text-rose-600 text-sm">{error}</div>}
        </div>
      )}

      <div className="flex items-center justify-between pt-2">
        <button onClick={()=>step>1 ? setStep(step-1) : onClose(false)} className="text-sm text-ink-mute hover:text-ink">
          {step>1 ? '← Back' : 'Cancel'}
        </button>
        {step < 3 ? (
          <Btn onClick={()=>setStep(step+1)} disabled={(step===1 && !propertyId) || (step===2 && blocked)}>{step===2 && blocked ? 'Dates taken' : 'Continue'}</Btn>
        ) : (
          <Btn kind="gold" onClick={save} disabled={saving || !propertyId || blocked}>
            {blocked ? 'Dates taken' : saving ? 'Saving…' : editing ? 'Save changes' : 'Confirm booking'}
          </Btn>
        )}
      </div>
    </div>
  )
}

/* ─────────────────────────────  Insights view  ───────────────────────────── */

function InsightsView({ users, properties, bookings, setView }) {
  const [year, setYear] = useState(new Date().getFullYear())
  const years = useMemo(() => {
    const s = new Set(bookings.map(b => parseLocal(b.start_date).getFullYear()))
    s.add(new Date().getFullYear())
    return [...s].sort((a,b)=>b-a)
  }, [bookings])

  const inYear = bookings.filter(b => parseLocal(b.start_date).getFullYear() === year)
  const propOf = id => properties.find(p=>p.id===id)

  const totalNights  = inYear.reduce((s,b) => s + nights(b.start_date,b.end_date), 0)
  const totalGuests  = inYear.reduce((s,b) => s + (b.guest_count||0), 0)
  const totalValue   = inYear.reduce((s,b) => {
    const p = propOf(b.property_id); return s + shadowValue(p?.nightly_rate_sar, nights(b.start_date,b.end_date))
  }, 0)

  const byUser = users.map(u => {
    const my = inYear.filter(b => b.booked_by === u.id)
    const nightsUsed = my.reduce((s,b)=>s+nights(b.start_date,b.end_date), 0)
    const value = my.reduce((s,b) => { const p = propOf(b.property_id); return s + shadowValue(p?.nightly_rate_sar, nights(b.start_date,b.end_date)) }, 0)
    return { ...u, bookings: my.length, nights: nightsUsed, guests: my.reduce((s,b)=>s+(b.guest_count||0),0), value }
  }).sort((a,b)=>b.nights-a.nights)

  const byProp = properties.map(p => {
    const my = inYear.filter(b => b.property_id === p.id)
    const ns = my.reduce((s,b)=>s+nights(b.start_date,b.end_date),0)
    return { ...p, bookings: my.length, nights: ns, value: shadowValue(p.nightly_rate_sar, ns), occupancy: Math.round((ns / 365) * 100) }
  }).sort((a,b)=>b.nights-a.nights)

  const byMonth = Array.from({length:12}, (_,m) => {
    const monthBookings = inYear.filter(b => parseLocal(b.start_date).getMonth() === m)
    return { m, count: monthBookings.length, nights: monthBookings.reduce((s,b)=>s+nights(b.start_date,b.end_date),0) }
  })
  const maxMonth = Math.max(1, ...byMonth.map(m=>m.nights))

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-8 py-8 space-y-8 fade-in">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div className="text-gold-500 tracking-[.3em] text-xs mb-2">RECEIPTS & PATTERNS</div>
          <h1 className="font-display text-4xl text-ink">Insights · {year}</h1>
        </div>
        <div className="flex items-center gap-2">
          <Btn kind="gold" onClick={()=>setView('wrapped')}>✨ {year} Wrapped</Btn>
          <select value={year} onChange={e=>setYear(+e.target.value)} className="rounded-full bg-white shadow-soft px-4 py-2 text-sm">
            {years.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>

      {/* Headline numbers */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <Stat label="Total nights"  value={totalNights}  sub="across all villas"/>
        <Stat label="Total guests"  value={totalGuests}  sub="hosted"/>
        <Stat label="Bookings"      value={inYear.length} sub="this year"/>
        <Stat label="Shadow value"  value={fmt.sar(totalValue)} sub="our 40% share if rented — operator keeps 60%" tone="gold"/>
      </div>

      {/* Per family member */}
      <section>
        <h2 className="font-display text-2xl mb-3">By family member</h2>
        <Card className="divide-y divide-sand-100">
          {byUser.map(u => (
            <div key={u.id} className="p-4 grid grid-cols-12 items-center gap-3">
              <div className="col-span-5 sm:col-span-3 flex items-center gap-3">
                <span className="w-10 h-10 rounded-full flex items-center justify-center text-xl"
                      style={{background:`${u.color}14`, boxShadow:`0 0 0 2px ${u.color}33 inset`}}>{u.emoji}</span>
                <span className="font-medium">{u.name}</span>
              </div>
              <div className="col-span-2 text-center">
                <div className="font-display text-xl">{u.nights}</div>
                <div className="text-[10px] text-ink-mute tracking-wider uppercase">nights</div>
              </div>
              <div className="col-span-2 text-center">
                <div className="font-display text-xl">{u.bookings}</div>
                <div className="text-[10px] text-ink-mute tracking-wider uppercase">stays</div>
              </div>
              <div className="col-span-3 text-center">
                <div className="font-display text-xl">{u.guests}</div>
                <div className="text-[10px] text-ink-mute tracking-wider uppercase">guests hosted</div>
              </div>
              <div className="col-span-12 sm:col-span-2 text-right">
                <div className="font-display text-xl text-gold-600">{fmt.sar(u.value)}</div>
                <div className="text-[10px] text-ink-mute tracking-wider uppercase">shadow value</div>
              </div>
            </div>
          ))}
        </Card>
      </section>

      {/* Per property */}
      <section>
        <h2 className="font-display text-2xl mb-3">By property</h2>
        <Card className="overflow-hidden">
          <div className="hidden sm:grid grid-cols-12 text-xs text-ink-mute uppercase tracking-wider px-4 py-2 bg-sand-50/60 border-b border-sand-100">
            <div className="col-span-5">Villa</div>
            <div className="col-span-2 text-center">Nights</div>
            <div className="col-span-2 text-center">Bookings</div>
            <div className="col-span-1 text-center">Occ.</div>
            <div className="col-span-2 text-right">Shadow value</div>
          </div>
          {byProp.map(p => (
            <div key={p.id} className="p-4 sm:grid sm:grid-cols-12 sm:items-center gap-3 border-b border-sand-100 last:border-b-0">
              <div className="col-span-5 flex items-center gap-3">
                <span className="w-1.5 h-10 rounded-full" style={{background:p.color}}/>
                <div>
                  <div className="font-medium">{p.name}</div>
                  <div className="text-xs text-ink-mute">{p.location}</div>
                </div>
              </div>
              <div className="col-span-2 text-center mt-2 sm:mt-0"><span className="font-display text-lg">{p.nights}</span> <span className="text-xs text-ink-mute sm:hidden">nights</span></div>
              <div className="col-span-2 text-center"><span className="font-display text-lg">{p.bookings}</span> <span className="text-xs text-ink-mute sm:hidden">stays</span></div>
              <div className="col-span-1 text-center">
                <div className="font-display text-lg">{p.occupancy}%</div>
              </div>
              <div className="col-span-2 text-right"><span className="font-display text-lg text-gold-600">{fmt.sar(p.value)}</span></div>
            </div>
          ))}
        </Card>
      </section>

      {/* By month */}
      <section>
        <h2 className="font-display text-2xl mb-3">When we go</h2>
        <Card className="p-5">
          <div className="grid grid-cols-12 gap-2 items-end h-40">
            {byMonth.map(m => (
              <div key={m.m} className="flex flex-col items-center gap-1.5">
                <div className="text-[10px] text-ink-mute">{m.nights||''}</div>
                <div className="w-full bg-gradient-to-t from-sea-500 to-sea-500/40 rounded-t-lg transition-all"
                     style={{height: `${(m.nights/maxMonth)*100}%`, minHeight:m.nights?'4px':'0'}}/>
                <div className="text-[10px] text-ink-mute tracking-wider">
                  {new Date(2000, m.m, 1).toLocaleString('en',{month:'short'}).toUpperCase()}
                </div>
              </div>
            ))}
          </div>
        </Card>
      </section>
    </div>
  )
}

function Stat({ label, value, sub, tone='ink' }) {
  const colors = { ink:'text-ink', gold:'text-gold-600', sea:'text-sea-500' }
  return (
    <Card className="p-5">
      <div className="text-xs text-ink-mute uppercase tracking-wider">{label}</div>
      <div className={`font-display text-3xl mt-1 ${colors[tone]}`}>{value}</div>
      <div className="text-xs text-ink-mute mt-1">{sub}</div>
    </Card>
  )
}

const VILLA_COLORS = ['#0c4a6e','#0369a1','#0284c7','#c9a64c','#7c3aed','#be185d','#047857','#b45309']
const VILLA_LOCATIONS = ['Shura Island','Amaala']

function AddPropertyForm({ properties, onClose, onSaved }) {
  const [name, setName]         = useState('')
  const [hotel, setHotel]       = useState('')
  const [location, setLocation] = useState(VILLA_LOCATIONS[0])
  const [otherLoc, setOtherLoc] = useState(false)
  const [bedrooms, setBedrooms] = useState(2)
  const [rate, setRate]         = useState('')
  const [color, setColor]       = useState(VILLA_COLORS[0])
  const [desc, setDesc]         = useState('')
  const [owned, setOwned]       = useState(false)
  const [saving, setSaving]     = useState(false)
  const [error, setError]       = useState(null)

  const save = async () => {
    if (!name.trim()) { setError('Give the villa a name first.'); return }
    setSaving(true); setError(null)
    const base = name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'villa'
    const { error } = await sb.from('properties').insert({
      slug: `${base}-${Math.random().toString(36).slice(2,6)}`,   // suffix keeps slugs unique
      name: name.trim(),
      hotel: hotel.trim() || name.trim(),
      location: location.trim() || '—',
      bedrooms: +bedrooms,
      nightly_rate_sar: +rate || 0,
      color,
      description: desc.trim() || null,
      is_owned: owned,
      is_active: true,
      sort_order: Math.max(0, ...properties.map(p=>p.sort_order||0)) + 1,
    })
    setSaving(false)

        <Field label="Location">

          {otherLoc && <input className={`${IPT} mt-2`} placeholder="Where is it?" value={location} onChange={e=>setLocation(e.target.value)}/>}
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Bedrooms"><Stepper value={bedrooms} set={setBedrooms} min={1} max={12}/></Field>
          <Field label="Nightly rate" hint="SAR">
            <input type="number" min="0" className={IPT} value={rate} onChange={e=>setRate(e.target.value)} placeholder="12000"/>
          </Field>
        </div>
        <Field label="Colour" hint="for the calendar & map">
          <div className="flex flex-wrap gap-2.5">
            {VILLA_COLORS.map(c => (
              <button key={c} type="button" onClick={()=>setColor(c)}
                className={`btn w-9 h-9 rounded-full ${color===c?'ring-2 ring-offset-2 ring-ink':''}`} style={{background:c}}/>
            ))}
          </div>
        </Field>
        <Field label="Description" hint="optional">
          <textarea rows="2" className={IPT} value={desc} onChange={e=>setDesc(e.target.value)} placeholder="What makes it special?"/>
        </Field>
        <label className="flex items-center gap-2.5 text-[15px] text-ink-soft cursor-pointer">
          <input type="checkbox" checked={owned} onChange={e=>setOwned(e.target.checked)} className="w-5 h-5 accent-sea-500"/>

        {error && <div className="text-rose-600 text-sm">{error}</div>}
        <div className="text-[12px] text-ink-mute">After adding, open the Map → “Place pins” to put it on the coast.</div>
      </div>
    </Modal>

}

/* ─────────────────────────────  Coast map view  ───────────────────────────── */

function MapView({ properties, bookings, openBookFor, setView, onChanged }) {
  const elRef = useRef(null), mapRef = useRef(null), layerRef = useRef(null)
  const today = fmt.iso(new Date())
  const occupiedNow = id => bookings.some(b => b.property_id===id && b.start_date<=today && b.end_date>=today)

  const [mode, setMode] = useState('view')       // 'view' | 'place'
  const [activeSlug, setActiveSlug] = useState(null)
  const [tick, setTick] = useState(0)            // bump to redraw after a local placement
  const [syncNote, setSyncNote] = useState(false)

  // refs so the once-bound map click handler always sees current values
  const modeRef = useRef(mode);            modeRef.current = mode
  const activeRef = useRef(activeSlug);    activeRef.current = activeSlug
  const propsRef = useRef(properties);     propsRef.current = properties
  const placeRef = useRef(() => {})

  const anyPlaced = properties.some(p => coordsFor(p, loadLocalPins())?.placed)

  // save a villa's coordinate (localStorage instantly + DB for sharing)
  const saveCoord = async (prop, latlng, advance) => {
    saveLocalPin(prop.slug, latlng.lat, latlng.lng)
    setTick(t => t + 1)
    if (advance) {
      const pins = loadLocalPins()
      const next = propsRef.current.find(p => p.slug !== prop.slug && p.lat == null && !pins[p.slug])
      setActiveSlug(next ? next.slug : null)
    }
    const { error } = await sb.from('properties').update({ lat: latlng.lat, lng: latlng.lng }).eq('id', prop.id)
    if (error) setSyncNote(true)
    else if (onChanged) { try { await onChanged() } catch (e) { console.error(e) } }
  }
  placeRef.current = (latlng) => {
    const prop = propsRef.current.find(p => p.slug === activeRef.current)
    if (prop) saveCoord(prop, latlng, true)
  }

  // init map once
  useEffect(() => {
    if (!elRef.current || mapRef.current || typeof L === 'undefined') return
    const map = L.map(elRef.current, { zoomControl:true, scrollWheelZoom:true })
    mapRef.current = map
    window.__map = map  // exposed for debugging
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      // Esri imagery for Shura/Amaala tops out at z17; beyond that it returns a
      // "data not available" placeholder. Cap tile fetching at 17 but let the map
      // zoom to 19 — Leaflet upscales the sharp z17 tile (a little soft, never blank).
      maxNativeZoom: 17, maxZoom: 19, attribution: 'Imagery © Esri, Maxar'
    }).addTo(map)
    map.setView([SHURA_CENTER.lat, SHURA_CENTER.lng], 13)
    map.on('click', e => { if (modeRef.current === 'place' && activeRef.current) placeRef.current(e.latlng) })
    const fit = () => {
      const pins = loadLocalPins()
      const placed = properties.map(p => coordsFor(p, pins)).filter(c => c && c.placed).map(c => [c.lat, c.lng])
      if (placed.length > 1) map.fitBounds(L.latLngBounds(placed).pad(0.5))
      else if (placed.length === 1) map.setView(placed[0], 16)
      else map.setView([SHURA_CENTER.lat, SHURA_CENTER.lng], 13)
    }
    setTimeout(() => { map.invalidateSize(); fit() }, 300)
    return () => { map.remove(); mapRef.current = null }
  }, [])

  // (re)draw pins
  useEffect(() => {
    const map = mapRef.current; if (!map || typeof L === 'undefined') return
    if (layerRef.current) map.removeLayer(layerRef.current)
    const layer = L.layerGroup().addTo(map); layerRef.current = layer
    const pins = loadLocalPins()
    const placing = mode === 'place'
    properties.forEach(p => {
      const c = coordsFor(p, pins); if (!c) return
      if (!c.placed && !placing) return            // in view mode, only show placed villas
      const occ = occupiedNow(p.id)
      const isActive = placing && p.slug === activeSlug
      const short = p.name.replace(/\s+—.*/, '')
      const cls = `map-pin ${occ?'occ':''} ${!c.placed?'ghost':''} ${isActive?'active':''}`
      const html = `<div class="${cls}" style="--c:${p.color}"><div class="map-pin-dot"></div>
        <div class="map-pin-label">${short}<span>${p.bedrooms}BR</span></div></div>`
      const icon = L.divIcon({ className:'map-pin-wrap', html, iconSize:[18,18], iconAnchor:[9,9] })
      const m = L.marker([c.lat, c.lng], { icon, draggable: placing }).addTo(layer)
      if (placing) {
        m.on('dragend', () => saveCoord(p, m.getLatLng(), false))
        m.on('click', () => setActiveSlug(p.slug))
      } else {
        m.bindPopup(`<div style="min-width:170px">
          <div style="font-family:'Cormorant Garamond',serif;font-size:19px;color:#1c2733;line-height:1.1">${p.name}</div>
          <div style="font-size:12px;color:#6b7785;margin:4px 0 8px">${p.location} · ${p.bedrooms}BR · ${occ?'🟢 In residence now':'Available'}</div>
          <button id="bk-${p.id}" style="background:#0c4a6e;color:#fff;border:none;border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer">Book this villa</button></div>`)
        m.on('popupopen', () => { const b=document.getElementById('bk-'+p.id); if (b) b.onclick = () => openBookFor(null, p.id) })
      }
    })
  }, [properties, bookings, tick, mode, activeSlug])

  const liveCount = properties.filter(p => occupiedNow(p.id)).length
  const placedCount = properties.filter(p => coordsFor(p, loadLocalPins())?.placed).length
  const startPlacing = () => {
    setMode('place')
    const pins = loadLocalPins()
    const firstUnplaced = properties.find(p => p.lat == null && !pins[p.slug]) || properties[0]
    setActiveSlug(firstUnplaced?.slug || null)
  }
  const activeName = properties.find(p => p.slug === activeSlug)?.name

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-8 py-8 fade-in">
      <div className="flex items-end justify-between mb-4 flex-wrap gap-3">
        <div>
          <div className="text-gold-500 tracking-[.3em] text-xs mb-2">THE COAST</div>
          <h1 className="font-display text-4xl text-ink">Our islands</h1>
          <p className="text-ink-mute mt-1">
            {mode === 'place'
              ? 'Placing pins — tap the island where each villa sits.'
              : (liveCount > 0 ? `${liveCount} villa${liveCount>1?'s':''} glowing — family in residence now.` : 'Tap a villa to book. Pins pulse when family is in residence.')}
          </p>
        </div>
        <div className="flex gap-2">
          {mode === 'view'
            ? <Btn kind="outline" onClick={startPlacing}>📍 Place pins</Btn>
            : <Btn kind="primary" onClick={()=>{ setMode('view'); setActiveSlug(null) }}>✓ Done</Btn>}
          <Btn kind="gold" onClick={()=>openBookFor()}>✦ Book</Btn>
        </div>
      </div>

      <div ref={elRef} className="w-full h-[64vh] min-h-[420px] rounded-3xl shadow-card z-0"/>

      {mode === 'place' && (
        <div className="mt-3 bg-white rounded-2xl shadow-soft p-4 fade-in">
          <div className="text-sm text-ink-soft mb-3">
            {activeSlug
              ? <>Now tap the map where <b className="text-ink">{activeName}</b> sits. (You can drag any pin to fine-tune.)</>
              : <>All villas placed 🎉 Drag any pin to adjust, or tap <b>Done</b>.</>}
          </div>
          <div className="flex flex-wrap gap-2">
            {properties.map(p => {
              const placed = coordsFor(p, loadLocalPins())?.placed
              const active = p.slug === activeSlug
              return (
                <button key={p.id} onClick={()=>setActiveSlug(p.slug)}
                  className={`flex items-center gap-2 rounded-full px-3 py-1.5 text-xs border ${active?'border-sea-500 bg-sea-50':'border-sand-200 bg-white'}`}>
                  <span className="w-2.5 h-2.5 rounded-full" style={{background:p.color}}/>
                  {p.name.replace(/\s+—.*/, '')} {p.name.match(/\d+BR|Home/)?.[0]||''}
                  <span className={placed?'text-emerald-600':'text-ink-mute'}>{placed?'✓':'• tap to place'}</span>
                </button>
              )
            })}
          </div>
          {syncNote && (
            <div className="mt-3 text-xs text-gold-700 bg-gold-50 border border-gold-300/40 rounded-xl px-3 py-2">
              Pins are saved on <b>this device</b>. To share them with the whole family, run the 2-line <code className="bg-white px-1 rounded">add-pin-columns.sql</code> in Supabase once — then they sync everywhere.
            </div>
          )}
        </div>
      )}

      {mode === 'view' && (
        <div className="mt-4 flex flex-wrap items-center gap-3">
          {properties.map(p => (
            <button key={p.id} onClick={()=>openBookFor(null, p.id)} className="flex items-center gap-1.5 text-xs text-ink-soft hover:text-ink">
              <span className="w-2.5 h-2.5 rounded-full" style={{background:p.color}}/>{p.name}{occupiedNow(p.id) && <span className="text-emerald-600">· now</span>}
            </button>
          ))}
          {placedCount < properties.length && (
            <span className="text-xs text-ink-mute">· {placedCount}/{properties.length} pinned — tap “Place pins” to set the rest</span>
          )}
        </div>
      )}
    </div>
  )
}

function TransportView({ user, users, properties, bookings, requests, requestsErr, reload }) {
  const [formOpen, setFormOpen] = useState(false)
  const [editing, setEditing] = useState(null)
  const propOf = id => properties.find(p=>p.id===id)
  const userOf = id => users.find(u=>u.id===id)

  const tableMissing = requestsErr && /transport_requests|does not exist|schema cache|Could not find the table/i.test(requestsErr.message||'')

  const setStatus = async (r, status) => {
    const patch = { status }
    if (status === 'arranged') patch.arranged_by = user.id
    if (status === 'requested') patch.arranged_by = null
    await sb.from('transport_requests').update(patch).eq('id', r.id)
    await reload()
  }
  const del = async (r) => { await sb.from('transport_requests').delete().eq('id', r.id); await reload() }

  if (tableMissing) {
    return (
      <div className="max-w-3xl mx-auto px-4 sm:px-8 py-8 fade-in">
        <div className="text-gold-500 tracking-[.3em] text-xs mb-2">TRANSPORT</div>
        <h1 className="font-display text-4xl text-ink mb-4">Car requests</h1>
        <Card className="p-6">
          <div className="text-5xl mb-3">🚗</div>
          <div className="font-display text-xl">One-time setup needed</div>
          <p className="text-ink-soft text-sm mt-2">
            The car-request inbox needs a quick database update. In Supabase → <b>SQL Editor</b> → <b>New query</b>,
            paste <code className="bg-sand-100 px-1 rounded">al-saif/schema_v2.sql</code> and click <b>Run</b> — then refresh.
            (This also enables shared map pins.)
          </p>
          <Btn className="mt-4" onClick={()=>location.reload()}>I've run it — reload</Btn>
        </Card>
      </div>
    )
  }

  const groups = {
    requested: requests.filter(r => r.status === 'requested'),
    arranged:  requests.filter(r => r.status === 'arranged'),
    closed:    requests.filter(r => r.status === 'done' || r.status === 'cancelled'),
  }

  const Section = ({ title, items, tone }) => items.length === 0 ? null : (
    <section className="mb-8">
      <div className="flex items-center gap-2 mb-3">
        <h2 className="font-display text-2xl">{title}</h2>
        <Chip tone={tone}>{items.length}</Chip>
      </div>
      <div className="grid sm:grid-cols-2 gap-4">
        {items.map(r => (
          <TransportCard key={r.id} r={r} prop={propOf(r.property_id)} who={userOf(r.requested_by)} arranger={userOf(r.arranged_by)}
            onArrange={()=>setStatus(r,'arranged')} onDone={()=>setStatus(r,'done')} onReopen={()=>setStatus(r,'requested')}
            onCancel={()=>setStatus(r,'cancelled')} onEdit={()=>{setEditing(r); setFormOpen(true)}} onDelete={()=>del(r)} />
        ))}
      </div>
    </section>
  )

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-8 py-8 fade-in">
      <div className="flex items-end justify-between mb-6 flex-wrap gap-3">
        <div>
          <div className="text-gold-500 tracking-[.3em] text-xs mb-2">TRANSPORT</div>
          <h1 className="font-display text-4xl text-ink">Car requests</h1>
          <p className="text-ink-mute mt-1">
            {groups.requested.length > 0
              ? `${groups.requested.length} request${groups.requested.length>1?'s':''} waiting to be arranged.`
              : 'Everything’s arranged. Raise a request and any of the family can sort the cars.'}
          </p>
        </div>
        <Btn kind="gold" onClick={()=>{ setEditing(null); setFormOpen(true) }}>🚗 New car request</Btn>
      </div>

      {requests.length === 0 ? (
        <Card className="p-10 text-center">
          <div className="text-5xl mb-3">🚗</div>
          <div className="font-display text-xl">No car requests yet</div>
          <div className="text-ink-mute text-sm mt-1">When you’re bringing guests, raise a request so someone can book their cars.</div>
          <Btn className="mt-4" kind="gold" onClick={()=>{ setEditing(null); setFormOpen(true) }}>Raise the first one</Btn>
        </Card>
      ) : (
        <>
          <Section title="Needs arranging" items={groups.requested} tone="gold" />
          <Section title="Arranged" items={groups.arranged} tone="green" />
          <Section title="Past & cancelled" items={groups.closed} tone="neutral" />
        </>
      )}

      <Modal open={formOpen} onClose={()=>{setFormOpen(false); setEditing(null)}} title={editing ? 'Edit car request' : 'New car request'}>
        <TransportForm user={user} properties={properties} bookings={bookings} users={users} editing={editing}
          onClose={async (saved)=>{ setFormOpen(false); setEditing(null); if (saved) await reload() }} />
      </Modal>
    </div>
  )
}

  const st = TRANSPORT_STATUS[r.status] || TRANSPORT_STATUS.requested
  const ct = CAR_TYPES.find(c=>c.id===r.car_type)
  const aud = audienceOf(r.for_whom)
  return (
    <Card className="p-5">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="flex items-center gap-2">
          <span className="text-2xl">{ct?.icon || '🚗'}</span>
          <div>
            <div className="font-medium text-ink">{aud ? `${aud.icon} ${aud.label}` : 'Cars'}</div>
            <div className="text-xs text-ink-mute">{r.cars} {carTypeLabel(r.car_type)}{r.cars>1?'s':''} · {r.passengers} passenger{r.passengers>1?'s':''}</div>

        </div>
        <Chip tone={st.tone}>{st.label}</Chip>
      </div>

      <div className="space-y-1.5 text-sm text-ink-soft mt-3">

        <div className="flex gap-2"><span className="text-ink-mute w-16 flex-shrink-0">To</span><span>{prop ? prop.name : '—'}</span></div>
        {r.notes && <div className="flex gap-2"><span className="text-ink-mute w-16 flex-shrink-0">Notes</span><span>{r.notes}</span></div>}
        <div className="flex gap-2"><span className="text-ink-mute w-16 flex-shrink-0">Raised by</span><span>{who ? `${who.emoji} ${who.name}` : '—'}{arranger && r.status!=='requested' ? ` · arranged by ${arranger.emoji} ${arranger.name}` : ''}</span></div>
      </div>

      <div className="flex flex-wrap gap-2 mt-4">
        {r.status === 'requested' && <>
          <Btn kind="primary" className="px-4 py-2" onClick={onArrange}>✓ Mark arranged</Btn>
          <Btn kind="soft" className="px-4 py-2" onClick={onEdit}>Edit</Btn>
          <Btn kind="ghost" className="px-3 py-2 text-ink-mute" onClick={onCancel}>Cancel</Btn>
        </>}
        {r.status === 'arranged' && <>
          <Btn kind="gold" className="px-4 py-2" onClick={onDone}>Mark done</Btn>
          <Btn kind="ghost" className="px-3 py-2 text-ink-mute" onClick={onReopen}>Reopen</Btn>
        </>}
        {(r.status === 'done' || r.status === 'cancelled') && <>
          <Btn kind="soft" className="px-4 py-2" onClick={onReopen}>Reopen</Btn>
          <Btn kind="ghost" className="px-3 py-2 text-rose-600" onClick={onDelete}>Delete</Btn>
        </>}
      </div>
    </Card>
  )
}

function TransportForm({ user, properties, bookings, users, editing, onClose }) {
  const userOf = id => users.find(u=>u.id===id)
  const toLocalInput = iso => { if(!iso) return ''; const d=new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16) }
  const isPreset = v => PICKUPS.includes(v)

  const [bookingId, setBookingId]   = useState(editing?.booking_id || '')
  const [propertyId, setPropertyId] = useState(editing?.property_id || '')
  const [audience, setAudience]     = useState(audienceOf(editing?.for_whom)?.id || 'family')
  const [passengers, setPassengers] = useState(editing?.passengers || 2)
  const [cars, setCars]             = useState(editing?.cars || 1)
  const [carType, setCarType]       = useState(editing?.car_type || 'sedan')
  const [pickup, setPickup]         = useState(editing?.pickup_location || PICKUPS[0])
  const [otherMode, setOtherMode]   = useState(editing?.pickup_location ? !isPreset(editing.pickup_location) : false)
  const [pickupAt, setPickupAt]     = useState(toLocalInput(editing?.pickup_at))
  const [notes, setNotes]           = useState(editing?.notes || '')
  const [saving, setSaving]         = useState(false)
  const [error, setError]           = useState(null)

  const upcoming = [...bookings].filter(b => b.end_date >= fmt.iso(new Date())).sort((a,b)=>a.start_date.localeCompare(b.start_date))
  const pickBooking = id => { setBookingId(id); const b = bookings.find(x=>x.id===id); if (b) setPropertyId(b.property_id) }
  const labelBooking = b => {
    const p = properties.find(x=>x.id===b.property_id); const u = userOf(b.booked_by)
    return `${u?.name||'?'} · ${p?p.name.replace(/\s+—.*/, ''):'?'} · ${fmt.short(b.start_date)}–${fmt.short(b.end_date)}`
  }

  const save = async () => {
    setSaving(true); setError(null)
    const row = {
      booking_id: bookingId || null, property_id: propertyId || null,
      requested_by: user.id, for_whom: audience,
      passengers: +passengers, cars: +cars, car_type: carType,
      pickup_location: pickup || null,
      pickup_at: pickupAt ? new Date(pickupAt).toISOString() : null,
      notes: notes || null,
    }
    const res = editing
      ? await sb.from('transport_requests').update(row).eq('id', editing.id)
      : await sb.from('transport_requests').insert({ ...row, status:'requested' })
    setSaving(false)
    if (res.error) setError(res.error.message); else onClose(true)
  }

  return (
    <div className="space-y-5">
      <Field label="Who's this for?">
        <OptionGroup options={AUDIENCES} value={audience} onChange={setAudience} cols={3} />
        <div className="text-[12px] text-ink-mute mt-1.5">{audienceOf(audience)?.hint}</div>
      </Field>

      <Field label="Link to a stay" hint="optional">
        <select value={bookingId} onChange={e=>pickBooking(e.target.value)} className={IPT}>
          <option value="">Not linked to a stay</option>
          {upcoming.map(b => <option key={b.id} value={b.id}>{labelBooking(b)}</option>)}
        </select>
      </Field>

      <div className="grid grid-cols-2 gap-3">
        <Field label="Cars"><Stepper value={cars} set={setCars} max={20} /></Field>
        <Field label="Passengers"><Stepper value={passengers} set={setPassengers} max={40} /></Field>
      </div>

      <Field label="Car type">
        <OptionGroup options={CAR_TYPES} value={carType} onChange={setCarType} cols={2} />
      </Field>

      <Field label="Pick-up airport">
        <div className="grid grid-cols-3 gap-2.5">
          {PICKUPS.map(p => (
            <button key={p} type="button" onClick={()=>{ setOtherMode(false); setPickup(p) }}
              className={optClass(!otherMode && pickup===p)}>✈ {p}</button>
          ))}
          <button type="button" onClick={()=>{ setOtherMode(true); setPickup('') }}
            className={optClass(otherMode)}>Other</button>
        </div>
        {otherMode && <input className={`${IPT} mt-2`} placeholder="Where from?" value={pickup} onChange={e=>setPickup(e.target.value)} />}
      </Field>

      <Field label="Pick-up date & time">
        <input type="datetime-local" className={IPT} value={pickupAt} onChange={e=>setPickupAt(e.target.value)} />
      </Field>

      <Field label="Destination villa">
        <select value={propertyId} onChange={e=>setPropertyId(e.target.value)} className={IPT}>
          <option value="">Select a villa…</option>
          {properties.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </Field>

      <Field label="Notes" hint="optional">
        <textarea rows="2" className={IPT} placeholder="Flight number, timing, child seats…" value={notes} onChange={e=>setNotes(e.target.value)} />
      </Field>

      {error && <div className="text-rose-600 text-sm">{error}</div>}
      <div className="flex justify-end gap-2 pt-1">
        <Btn kind="ghost" onClick={()=>onClose(false)}>Cancel</Btn>
        <Btn kind="gold" onClick={save} disabled={saving}>{saving?'Saving…':(editing?'Save changes':'Raise request')}</Btn>
      </div>
    </div>
  )
}

/* ─────────────────────────────  Al Saif Wrapped  ───────────────────────────── */

function WrappedView({ users, properties, bookings, setView }) {
  const [year, setYear] = useState(new Date().getFullYear())
  const years = useMemo(() => {
    const s = new Set(bookings.map(b => parseLocal(b.start_date).getFullYear()))
    s.add(new Date().getFullYear()); return [...s].sort((a,b)=>b-a)
  }, [bookings])

  const propOf = id => properties.find(p=>p.id===id)
  const nightsOf = b => nights(b.start_date, b.end_date)
  const valueOf  = b => shadowValue(propOf(b.property_id)?.nightly_rate_sar, nightsOf(b))
  const inYear = bookings.filter(b => parseLocal(b.start_date).getFullYear() === year)

  const totalNights = inYear.reduce((s,b)=>s+nightsOf(b),0)
  const totalGuests = inYear.reduce((s,b)=>s+(b.guest_count||0),0)
  const totalValue  = inYear.reduce((s,b)=>s+valueOf(b),0)

  const propNights = {}
  inYear.forEach(b => { propNights[b.property_id] = (propNights[b.property_id]||0) + nightsOf(b) })
  const favPropId = Object.keys(propNights).sort((a,b)=>propNights[b]-propNights[a])[0]
  const favProp = propOf(favPropId)

  const monthN = Array(12).fill(0)
  inYear.forEach(b => { monthN[parseLocal(b.start_date).getMonth()] += nightsOf(b) })
  const busiestMonth = monthN.some(x=>x>0) ? new Date(2000, monthN.indexOf(Math.max(...monthN)),1).toLocaleString('en',{month:'long'}) : '—'

  const perUser = users.map(u => {
    const my = inYear.filter(b => b.booked_by === u.id)
    const pn = {}; my.forEach(b => { pn[b.property_id]=(pn[b.property_id]||0)+nightsOf(b) })
    const topId = Object.keys(pn).sort((a,b)=>pn[b]-pn[a])[0]
    return { ...u, stays: my.length, nights: my.reduce((s,b)=>s+nightsOf(b),0),
      guests: my.reduce((s,b)=>s+(b.guest_count||0),0), value: my.reduce((s,b)=>s+valueOf(b),0),
      topProp: propOf(topId)?.name }
  })
  const leaderId = (key) => perUser.reduce((best,u)=> u[key] > (best? best[key] : -1) ? u : best, null)?.id
  const titles = {}
  const assign = (key, title) => { const id = leaderId(key); if (id && perUser.find(u=>u.id===id)[key] > 0 && !titles[id]) titles[id] = title }
  assign('guests', 'The Host 🥂'); assign('nights', 'The Regular ☀️'); assign('stays', 'The Explorer 🧭'); assign('value', 'The Generous One 💛')

  const empty = inYear.length === 0
  const doPrint = () => window.print()

  return (
    <div className="max-w-2xl mx-auto px-4 sm:px-8 py-8 fade-in">
      <div className="flex items-center justify-between mb-6 no-print">
        <button onClick={()=>setView('insights')} className="text-sm text-ink-mute hover:text-ink">← Back</button>
        <div className="flex items-center gap-2">
          <select value={year} onChange={e=>setYear(+e.target.value)} className="rounded-full bg-white shadow-soft px-4 py-2 text-sm">
            {years.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
          {!empty && <Btn kind="gold" onClick={doPrint}>⬇ Save / share</Btn>}
        </div>
      </div>

      <div id="wrapped-cards" className="space-y-5">
        {/* Cover */}
        <div className="wrap-card rounded-3xl p-8 text-center text-white relative overflow-hidden"
             style={{ background:'linear-gradient(150deg,#0c4a6e,#062b3e 60%,#0b1f33)' }}>
          <div className="absolute -top-8 -right-8 w-40 h-40 rounded-full" style={{background:'rgba(201,166,76,.18)'}}/>
          <div className="relative">
            <div className="tracking-[.4em] text-gold-300 text-xs mb-3">A L · S A I F</div>
            <div className="font-display text-6xl leading-none">{year}</div>
            <div className="font-display text-3xl text-gold-300 mt-1">Wrapped</div>
            <p className="text-sand-200/80 text-sm mt-4">Our year across the coast.</p>
          </div>
        </div>

        {empty ? (
          <div className="wrap-card rounded-3xl p-8 bg-white shadow-card text-center">
            <div className="text-5xl mb-3">🌅</div>
            <div className="font-display text-2xl">Your {year} is just beginning</div>
            <p className="text-ink-mute text-sm mt-2">Book a few stays and your Wrapped fills with nights, guests, and the value you’ve shared.</p>
          </div>
        ) : (
          <>
            {/* Family totals */}
            <div className="wrap-card rounded-3xl p-7 bg-white shadow-card">
              <div className="text-gold-500 tracking-[.3em] text-xs mb-4">THE FAMILY · {year}</div>
              <div className="grid grid-cols-2 gap-5">
                <BigStat n={totalNights} label="nights on the coast" />
                <BigStat n={totalGuests} label="guests hosted" />
                <BigStat n={inYear.length} label={inYear.length===1?'stay booked':'stays booked'} />
                <BigStat n={busiestMonth} label="busiest month" small />
              </div>
              <div className="mt-6 rounded-2xl p-5" style={{background: favProp ? `${favProp.color}10` : '#f7f2e8'}}>
                <div className="text-xs text-ink-mute uppercase tracking-wider">Favourite villa</div>
                <div className="font-display text-2xl text-ink">{favProp ? favProp.name : '—'}</div>
              </div>
              <div className="mt-3 rounded-2xl p-5 bg-gold-50">
                <div className="text-xs text-gold-600 uppercase tracking-wider">Shadow value gifted</div>
                <div className="font-display text-3xl text-gold-600">{fmt.sar(totalValue)}</div>
                <div className="text-xs text-ink-mute mt-1">our 40% share of what these stays would’ve earned if rented — given freely to family & guests.</div>
              </div>
            </div>

            {/* Per-person cards */}
            {perUser.filter(u=>u.stays>0).map(u => (
              <div key={u.id} className="wrap-card rounded-3xl p-7 text-white relative overflow-hidden"
                   style={{ background:`linear-gradient(150deg, ${u.color}, ${u.color}cc 70%, ${u.color}99)` }}>
                <div className="absolute -bottom-10 -right-6 text-[140px] opacity-15 leading-none">{u.emoji}</div>
                <div className="relative">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-2xl">{u.emoji}</span>
                    <span className="font-display text-3xl">{u.name}’s {year}</span>
                  </div>
                  {titles[u.id] && <div className="inline-block bg-white/20 rounded-full px-3 py-1 text-sm mb-4">{titles[u.id]}</div>}
                  <div className="grid grid-cols-3 gap-4 mt-3">
                    <div><div className="font-display text-4xl">{u.nights}</div><div className="text-xs opacity-80">nights</div></div>
                    <div><div className="font-display text-4xl">{u.stays}</div><div className="text-xs opacity-80">stays</div></div>
                    <div><div className="font-display text-4xl">{u.guests}</div><div className="text-xs opacity-80">guests</div></div>
                  </div>
                  {u.topProp && <div className="mt-5 text-sm opacity-90">Favourite escape · <b>{u.topProp}</b></div>}
                  <div className="mt-1 text-sm opacity-90">Gifted · <b>{fmt.sar(u.value)}</b> in stays</div>
                </div>
              </div>
            ))}

            {/* Closing */}
            <div className="wrap-card rounded-3xl p-8 text-center bg-white shadow-card">
              <div className="text-3xl mb-2">🌊</div>
              <div className="font-display text-2xl text-ink">Here’s to more time together in {year+1}.</div>
              <div className="divider-gold w-32 mx-auto mt-4"/>
              <div className="text-gold-500 tracking-[.3em] text-xs mt-4">A L · S A I F</div>
            </div>
          </>
        )}
      </div>
    </div>
  )
}

const BigStat = ({ n, label, small }) => (
  <div>
    <div className={`font-display text-ink ${small?'text-3xl':'text-5xl'} leading-none`}>{n}</div>
    <div className="text-xs text-ink-mute mt-1">{label}</div>
  </div>
)

/* ─────────────────────────────  Setup helper  ───────────────────────────── */

function SetupHelp({ error }) {
  const msg = error?.message || String(error)
  const missingTable = /relation .* does not exist|Could not find the table|schema cache/i.test(msg)
  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <Card className="max-w-xl w-full p-8 fade-in">
        <div className="text-gold-500 tracking-[.3em] text-xs mb-2">SETUP NEEDED</div>
        <h1 className="font-display text-3xl text-ink mb-4">
          {missingTable ? 'Database not set up yet' : "Can't reach Supabase"}
        </h1>
        {missingTable ? (
          <ol className="space-y-3 text-sm text-ink-soft list-decimal pl-5">
            <li>Open your Supabase project <a href="https://supabase.com/dashboard" target="_blank" className="text-sea-500 underline">dashboard</a>.</li>
            <li>Left sidebar → <b>SQL Editor</b> → <b>New query</b>.</li>
            <li>Copy <code className="bg-sand-100 px-1 rounded">al-saif/schema.sql</code> into the editor and click <b>Run</b>.</li>
            <li>Refresh this page.</li>
          </ol>
        ) : (
          <div className="text-sm text-ink-soft space-y-2">
            <p>Check that the Supabase URL and publishable key inside this HTML file match your project.</p>
            <p>If the project is paused (free tier auto-pauses after a week of inactivity), open the dashboard and click <b>Restore</b>.</p>
          </div>
        )}
        <details className="mt-5">
          <summary className="text-xs text-ink-mute cursor-pointer">Show technical error</summary>
          <pre className="mt-2 p-3 bg-sand-100 rounded-lg text-xs text-ink-soft overflow-x-auto whitespace-pre-wrap">{msg}</pre>
        </details>
        <Btn className="mt-6" kind="primary" onClick={()=>location.reload()}>I've set it up — reload</Btn>
      </Card>
    </div>
  )
}

/* ─────────────────────────────  App shell  ───────────────────────────── */

function App() {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('al-saif-user') || 'null') } catch { return null }
  })
  const [view, setView] = useState('today')
  const [bookOpen, setBookOpen] = useState(false)
  const [prefill, setPrefill] = useState(null)
  const [editBooking, setEditBooking] = useState(null)   // booking row being edited, or null = new

  const { rows: users,      err: usersErr } = useTable('users', { order:'sort_order' })
  const { rows: properties, err: propsErr, reload: reloadProps } = useTable('properties', { order:'sort_order' })
  const { rows: bookings,   err: bookErr, reload: reloadBookings } = useTable('bookings', { order:'start_date' })
  const { rows: requests,   err: reqErr,  reload: reloadTransport } = useTable('transport_requests', { order:'created_at', ascending:false })
  const pendingTransport = (requests || []).filter(r => r.status === 'requested').length

  const pickUser = u => { localStorage.setItem('al-saif-user', JSON.stringify(u)); setUser(u) }
  const signOut  = () => { localStorage.removeItem('al-saif-user'); setUser(null) }

  const openBook = useCallback((date=null, propertyId=null) => {
    setEditBooking(null)
    setPrefill({ date, propertyId })
    setBookOpen(true)
  }, [])
  const openEdit = useCallback((booking) => {
    setPrefill(null)
    setEditBooking(booking)
    setBookOpen(true)
  }, [])

  const firstErr = usersErr || propsErr || bookErr
  if (firstErr) return <SetupHelp error={firstErr}/>

  // initial: waiting on data
  if (users === null || properties === null || bookings === null) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center">
        <div className="font-display text-3xl text-ink">Al Saif</div>
        <div className="text-gold-500 tracking-[.3em] text-xs mt-2">CONNECTING</div>
        <div className="mt-6"><Spinner/></div>
      </div>
    )
  }

  if (users.length === 0 || properties.length === 0) return <SetupHelp error={{message:'Tables are empty — seed data did not load.'}}/>

  if (!user) return <AvatarPicker users={users} onPick={pickUser}/>

  return (
    <>
      <TopBar user={user} view={view} setView={view => { setView(view); if (view==='book') openBook() }} onSignOut={signOut} pendingTransport={pendingTransport}/>
      {/* bottom padding on mobile so the fixed tab bar never covers content */}
      <main className="pb-28 md:pb-0">
        {view === 'today'      && <TodayView user={user} users={users} properties={properties} bookings={bookings} setView={setView} openBook={()=>openBook()} pendingTransport={pendingTransport}/>}
        {view === 'map'        && <MapView properties={properties} bookings={bookings} openBookFor={openBook} setView={setView} onChanged={reloadProps}/>}
        {view === 'calendar'   && <CalendarView properties={properties} users={users} bookings={bookings} openBookFor={d=>openBook(d)} openEdit={openEdit} onChanged={reloadBookings}/>}
        {view === 'cars'       && <TransportView user={user} users={users} properties={properties} bookings={bookings} requests={requests||[]} requestsErr={reqErr} reload={reloadTransport}/>}
        {view === 'insights'   && <InsightsView users={users} properties={properties} bookings={bookings} setView={setView}/>}
        {view === 'wrapped'    && <WrappedView users={users} properties={properties} bookings={bookings} setView={setView}/>}
        {view === 'properties' && <PropertiesView properties={properties} bookings={bookings} openBookFor={openBook} onUpdate={reloadProps}/>}

        <footer className="max-w-6xl mx-auto px-8 py-10 text-center text-xs text-ink-mute">
          <div className="divider-gold w-32 mx-auto mb-4"/>
          Al Saif Concierge · Synced live · {users.length} family members · {properties.length} retreats
        </footer>
      </main>

      <BottomBar view={view} setView={setView} openBook={()=>openBook()} pendingTransport={pendingTransport}/>

      <Modal open={bookOpen} onClose={()=>{ setBookOpen(false); setPrefill(null); setEditBooking(null) }} title={editBooking ? 'Edit booking' : 'New booking'}>
        <BookForm
          user={user}
          users={users}
          properties={properties.filter(p => p.is_active !== false || p.id === editBooking?.property_id)}
          bookings={bookings}
          prefill={prefill}
          editing={editBooking}
          onSaved={reloadBookings}
          onClose={(saved) => {
            const wasEdit = !!editBooking
            setBookOpen(false); setPrefill(null); setEditBooking(null)
            if (saved && !wasEdit) setView('today')
          }}
        />
      </Modal>
    </>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
